<svg width="100%" height="100%" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111214"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <radialGradient id="backlight" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.4)"/>
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)"/>
    </radialGradient>

    <linearGradient id="liteGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#C084FC" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="36" height="36" rx="8" fill="url(#bg)"/>
  <rect width="36" height="36" rx="8" fill="url(#backlight)"/>
  <rect x="0.5" y="0.5" width="35" height="35" rx="7.5" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <g filter="url(#glow)">
    <line x1="16" y1="9" x2="12" y2="27"
          stroke="url(#liteGradient)"
          stroke-width="2"
          stroke-linecap="round"/>

    <path d="M 19 12 L 25 18 L 19 24"
          fill="none"
          stroke="url(#liteGradient)"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
