<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <meta name="view-transition" content="same-origin">
  <title>LiteGist | Login</title>
  <link rel="stylesheet" href="/admin/styles.css">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    body, html { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: var(--bg); transition: background 0.3s ease; }
    .login-card { width: 100%; max-width: 360px; text-align: center; padding: 40px 30px; box-sizing: border-box; }
    h1 { margin-top: 0; margin-bottom: 30px; color: var(--text); font-size: 28px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    .input-group input { padding: 12px 16px; font-size: 16px; }
    .btn-login { width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; }
    .err { color: var(--red); font-size: 0.9rem; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="login-card card">
    <h1>LiteGist</h1>
    <div class="input-group">
      <input type="text" id="user" placeholder="Username">
    </div>
    <div class="input-group">
      <input type="password" id="pass" placeholder="Password">
    </div>
    <button id="btn-login" class="btn primary btn-login">Login</button>
    <div id="err" class="err hidden"></div>
  </div>

  <script>
    const themeQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }

    // Init theme
    const saved = sessionStorage.getItem('theme');
    if (saved) applyTheme(saved);
    else applyTheme(themeQuery.matches ? 'dark' : 'light');

    // Listen for system changes
    themeQuery.addEventListener('change', (e) => {
      if (!sessionStorage.getItem('theme')) applyTheme(e.matches ? 'dark' : 'light');
    });

    const $ = id => document.getElementById(id);
    $('btn-login').onclick = async () => {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: $('user').value, password: $('pass').value })
      });
      const data = await res.json();
      if (data.ok) {
        window.location.href = '/admin';
      } else {
        const err = $('err');
        err.textContent = data.error || 'Login failed';
        err.classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
