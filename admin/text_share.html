<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark light">
  <meta name="view-transition" content="same-origin">
  <title>__PAGE_TITLE__</title>
  <script>
    var _ssTheme = sessionStorage.getItem('tf_share_theme');
    if (_ssTheme) {
      document.documentElement.setAttribute('data-theme', _ssTheme);
    } else {
      document.documentElement.setAttribute('data-theme',
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
  </script>
  <style>
    :root {
      --bg: #0a0a0a; --card: #161616; --accent: #007aff; --text: #e0e0e0; --muted: #888; --border: rgba(255,255,255,0.08);
      --glass: rgba(255, 255, 255, 0.04); --input-bg: #222; --highlight: rgba(0, 122, 255, 0.4); --current-match: #ffeb3b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f5f7; --card: #ffffff; --accent: #0066cc; --text: #1d1d1f; --muted: #86868b; --border: rgba(0,0,0,0.1);
        --glass: rgba(0, 0, 0, 0.04); --input-bg: #f0f0f0;
      }
    }
    [data-theme="dark"] {
      --bg: #0a0a0a !important; --card: #161616 !important; --accent: #007aff !important; --text: #e0e0e0 !important; --muted: #888 !important; --border: rgba(255,255,255,0.08) !important;
      --glass: rgba(255, 255, 255, 0.04) !important; --input-bg: #222 !important;
    }
    [data-theme="light"] {
      --bg: #f5f5f7 !important; --card: #ffffff !important; --accent: #0066cc !important; --text: #1d1d1f !important; --muted: #86868b !important; --border: rgba(0,0,0,0.1) !important;
      --glass: rgba(0, 0, 0, 0.04) !important; --input-bg: #f0f0f0 !important;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: background 0.3s ease, color 0.3s ease; }
    
    .content { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    .header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    
    .toolbar { padding: 8px 1rem; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
    .toolbar-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; overflow-x: auto; }
    
    .search-container { flex: 1; position: relative; display: flex; align-items: center; background: var(--input-bg); border: 1px solid var(--border); border-radius: 10px; padding: 2px 8px; }
    .search-input { flex: 1; background: transparent; border: none; padding: 6px 4px; color: var(--text); outline: none; font-size: 16px; }
    .search-nav { display: flex; align-items: center; gap: 4px; padding-left: 8px; border-left: 1px solid var(--border); }
    .nav-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 4px; font-size: 14px; }
    .nav-btn:hover { color: var(--text); background: var(--glass); }
    .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }
    
    .action-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; display: flex; align-items: center; gap: 6px; flex-shrink: 0; white-space: nowrap; }
    .action-btn:hover { border-color: var(--accent); background: var(--glass); }
    .action-btn i { font-style: normal; opacity: 0.7; }
    .convert-anchor { position: relative; display: inline-flex; }
    .convert-popover {
      position: fixed; z-index: 120;
      min-width: 230px; max-width: min(82vw, 520px); padding: 10px;
      border-radius: 14px; border: 1px solid var(--border); background: var(--card);
      box-shadow: 0 20px 40px rgba(0,0,0,.35); display: flex; flex-wrap: wrap; gap: 8px;
    }

    .stats-bar { padding: 4px 1rem; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; background: var(--bg); }
    
    .viewer { flex: 1; overflow: auto; padding: 1.5rem; background: var(--card); }
    #text-display { margin: 0; white-space: pre-wrap; word-break: break-all; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 14px; line-height: 1.6; }
    
    .match { background: var(--highlight); border-radius: 2px; box-shadow: 0 0 0 1px var(--accent); }
    .match.current { background: var(--current-match); color: #000; box-shadow: 0 0 8px var(--current-match); position: relative; z-index: 1; }

    .auth-overlay { position: absolute; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; }
    .auth-box { width: 300px; background: var(--card); padding: 2rem; border-radius: 16px; border: 1px solid var(--border); text-align: center; }
    .auth-box input { width: 100%; padding: 10px; margin: 15px 0; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; font-size: 16px; }
    .primary-btn { width: 100%; background: #161616; color: #ffffff; border: 1px solid rgba(255,255,255,0.12); padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    [data-theme="light"] .primary-btn { background: #ffffff; color: #000000; border: 1px solid rgba(0,0,0,0.15); }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .primary-btn { background: #ffffff; color: #000000; border: 1px solid rgba(0,0,0,0.15); } }
    
    .theme-btn { background: transparent; border: none; color: var(--text); cursor: pointer; font-size: 1.2rem; padding: 4px 8px; border-radius: 8px; }
    .theme-btn:hover { background: var(--glass); }

    .hidden { display: none !important; }
    .copy-flash { border-color: #3fb950 !important; background: rgba(63,185,80,0.13) !important; color: #3fb950 !important; transition: border-color 0.1s, background 0.1s, color 0.1s; }
    .top-sticky-wrap { position: sticky; top: 0; z-index: 50; background: var(--bg); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }

    /* Markdown styling */
    #markdown-view.markdown-body { 
        padding: 2rem; background: transparent; color: inherit; min-height: 100px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    [data-theme="light"] #markdown-view.markdown-body { background: #fff !important; color: #24292f !important; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) #markdown-view.markdown-body { background: #fff !important; color: #24292f !important; } }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/github-markdown-css@5.5.1/github-markdown.min.css">
  <link rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" id="hl-theme">
</head>
<body>
  <div id="auth-view" class="auth-overlay hidden">
    <div class="auth-box">
      <h3 style="margin-top:0">Protected Text</h3>
      <input type="text" id="auth-pass" placeholder="Password" autocomplete="off" data-1p-ignore data-lpignore="true" style="-webkit-text-security: disc;">
      <button id="auth-btn" class="primary-btn">Unlock</button>
      <p id="auth-err" style="color:#ff4b4b; font-size:12px; margin-top:10px"></p>
    </div>
  </div>

  <main class="content">
    <div class="top-sticky-wrap">
    <div class="header">
      <div style="display:flex; align-items:center; gap:10px">
        <span style="font-size:1.5rem">📄</span>
        <div>
          <h1 id="title-text">Shared __TITLE_TYPE__</h1>
          <div id="slug-text" style="font-size: 11px; color: var(--muted)">/text/__SLUG__</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;">
        <button id="btn-scroll-top" class="theme-btn" title="Back to top">⬆️</button>
        <button id="theme-toggle" class="theme-btn">🌓</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-row">
        <div class="search-container">
          <span style="opacity:0.5; margin-right:4px">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="Search text..." autocomplete="off" data-1p-ignore data-lpignore="true">
          <div class="search-nav">
            <span id="search-index" style="font-size:11px; color:var(--muted); margin-right:4px">0/0</span>
            <button id="nav-up" class="nav-btn" title="Previous match" disabled>↑</button>
            <button id="nav-down" class="nav-btn" title="Next match" disabled>↓</button>
          </div>
        </div>
      </div>
      <div class="toolbar-row" style="margin-top:2px">
        <button id="btn-raw" class="action-btn"><i>( )</i> Raw</button>
        <button id="btn-copy" class="action-btn"><i>📋</i> Copy</button>
        <button id="btn-dl" class="action-btn"><i>📥</i> Download</button>
        <div id="sub-convert-row" class="hidden">
          <div class="convert-anchor">
            <button id="btn-convert-toggle" class="action-btn"><i>⚙</i> Convert</button>
            <div id="convert-popover" class="convert-popover hidden">
              <button class="action-btn" data-convert-url="/__SLUG__/raw/clash"><i>⚙</i> Clash</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/mihomo"><i>⚙</i> Mihomo</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/stash"><i>⚙</i> Stash</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/surfboard"><i>⚙</i> Surfboard</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/surge"><i>⚙</i> Surge</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/surgemac"><i>⚙</i> Surge (macOS)</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/loon"><i>⚙</i> Loon</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/shadowrocket"><i>⚙</i> Shadowrocket</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/qx"><i>⚙</i> QX</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/egern"><i>⚙</i> Egern</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/singbox"><i>⚙</i> Sing-box</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/v2ray"><i>⚙</i> V2Ray</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/uri"><i>⚙</i> URI</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/json"><i>⚙</i> JSON</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/b64"><i>⚙</i> Base64</button>
              <button class="action-btn" data-convert-url="/__SLUG__/raw/b32"><i>⚙</i> Base32</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="stats-bar">
      <div id="stats-left">...</div>
      <div id="type-badge" style="background:var(--glass); padding:1px 6px; border-radius:4px; font-size:9px">__BADGE_TYPE__</div>
    </div>
    </div><!-- /.top-sticky-wrap -->

    <div class="viewer" style="-webkit-overflow-scrolling:touch;">
      <div id="markdown-view" class="markdown-body" style="display:none;"></div>
      <pre id="text-display" style="display:none; margin:0;"><code id="code-block" class="hljs" style="background:transparent; padding:0;">__CONTENT__</code></pre>
    </div>
  </main>
  <script src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <script src="https://unpkg.com/marked@12.0.0/marked.min.js"></script>

  <script>
    const config = {
      slug: "__SLUG__", type: "__TYPE__", token: "__TOKEN__",
      needsAuth: JSON.parse("__NEEDS_AUTH__"), hasPassword: JSON.parse("__HAS_PASS__"),
      isLarge: JSON.parse("__LARGE__"),
      content: '' // will be populated below
    };

    if (config.needsAuth) document.getElementById('auth-view').classList.remove('hidden');
    if (config.type === 'sub') document.getElementById('sub-convert-row').classList.remove('hidden');

    const themeQuery = window.matchMedia('(prefers-color-scheme: dark)');
    function updateThemes(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const hlLink = document.getElementById('hl-theme');
      if (hlLink) hlLink.href = theme === 'light' 
        ? "https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/github.min.css"
        : "https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css";
    }

    // Sync hljs to match current theme (data-theme set by early script)
    updateThemes(document.documentElement.getAttribute('data-theme') || 'dark');

    document.getElementById('theme-toggle').onclick = () => {
      const current = document.documentElement.getAttribute('data-theme') || (themeQuery.matches ? 'dark' : 'light');
      const theme = current === 'dark' ? 'light' : 'dark';
      updateThemes(theme);
      sessionStorage.setItem('tf_share_theme', theme);
    };

    themeQuery.addEventListener('change', (e) => {
      if (!sessionStorage.getItem('tf_share_theme')) {
        updateThemes(e.matches ? 'dark' : 'light');
      }
    });

    function highlightTextNodes(container, query) {
      if (!query || query.length < 2) return;
      const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
      const nodes = [];
      let node;
      while (node = walker.nextNode()) nodes.push(node);

      nodes.forEach(textNode => {
        const text = textNode.nodeValue;
        if (regex.test(text)) {
          const fragment = document.createDocumentFragment();
          let lastIdx = 0;
          text.replace(regex, (match, offset) => {
            fragment.appendChild(document.createTextNode(text.substring(lastIdx, offset)));
            const span = document.createElement('span');
            span.className = 'match';
            span.textContent = match;
            fragment.appendChild(span);
            lastIdx = offset + match.length;
          });
          fragment.appendChild(document.createTextNode(text.substring(lastIdx)));
          textNode.parentNode.replaceChild(fragment, textNode);
        }
      });
    }

    function renderContent(searchQuery = '') {
      const codeBlock = document.getElementById('code-block');
      const markdownView = document.getElementById('markdown-view');
      const textDisplay = document.getElementById('text-display');
      const renderer = (typeof marked !== 'undefined' && marked.marked) ? marked.marked : (typeof marked === 'function' ? marked : null);

      if (config.type === 'markdown' && renderer) {
        markdownView.innerHTML = renderer.parse(config.content);
        if (searchQuery) highlightTextNodes(markdownView, searchQuery);
        markdownView.style.display = 'block';
        textDisplay.style.display = 'none';
      } else {
        const isCode = config.type === 'code' || config.type === 'sub';
        if (isCode && typeof hljs !== 'undefined' && config.content.length < 10000) {
          codeBlock.innerHTML = hljs.highlightAuto(config.content).value;
        } else {
          codeBlock.innerText = config.content;
        }
        
        if (searchQuery) highlightTextNodes(codeBlock, searchQuery);
        markdownView.style.display = 'none';
        textDisplay.style.display = 'block';
      }
      document.getElementById('stats-left').innerText = `${config.content.length} characters · ${config.content.split('\n').length} lines`;
    }

    // 初始化：内联内容或异步加载
    async function initContent() {
      if (config.isLarge) {
        // 大文本：通过 /raw 接口异步加载，不阻塞 HTML 解析
        document.getElementById('stats-left').innerText = 'Loading...';
        try {
          const rawUrl = config.hasPassword ? `/token:${config.token}/${config.slug}/raw` : `/${config.slug}/raw`;
          const resp = await fetch(rawUrl);
          if (resp.ok) {
            config.content = await resp.text();
          } else {
            config.content = '[Error: Failed to load content]';
          }
        } catch (e) {
          config.content = '[Error: ' + e.message + ']';
        }
      } else {
        // 小文本：已内联在 HTML 中
        config.content = document.getElementById('code-block').innerText;
      }
      renderContent();
    }

    initContent();

    document.getElementById('btn-raw').onclick = () => {
      const url = config.hasPassword ? `/token:${config.token}/${config.slug}/raw` : `/${config.slug}/raw`;
      copyToClipboard(window.location.origin + url);
      window.open(url, '_blank');
    };

    document.getElementById('btn-copy').onclick = () => {
      const ta = document.createElement("textarea"); ta.value = config.content; ta.style.position="fixed"; ta.style.left="-999px";
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      const b = document.getElementById('btn-copy'); b.classList.add('copy-flash'); setTimeout(() => b.classList.remove('copy-flash'), 700);
    };

    document.getElementById('btn-dl').onclick = () => {
      const blob = new Blob([config.content], { type: 'text/plain' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${config.slug}.txt`; a.click();
    };

    function positionConvertPopover(anchor, popover) {
      if (!anchor || !popover) return;
      const margin = 12;
      const rect = anchor.getBoundingClientRect();
      const popRect = popover.getBoundingClientRect();
      const maxLeft = Math.max(margin, window.innerWidth - popRect.width - margin);
      const left = Math.min(Math.max(rect.left, margin), maxLeft);
      popover.style.top = `${Math.round(rect.bottom + 10)}px`;
      popover.style.left = `${Math.round(left)}px`;
    }

    const convertToggle = document.getElementById('btn-convert-toggle');
    const convertPopover = document.getElementById('convert-popover');
    if (convertToggle && convertPopover) {
      convertToggle.onclick = (event) => {
        event.stopPropagation();
        const willOpen = convertPopover.classList.contains('hidden');
        convertPopover.classList.toggle('hidden');
        if (willOpen) positionConvertPopover(convertToggle.closest('.convert-anchor'), convertPopover);
      };
      convertPopover.querySelectorAll('[data-convert-url]').forEach(btn => {
        btn.onclick = (event) => {
          event.stopPropagation();
          const baseUrl = btn.getAttribute('data-convert-url');
          const finalUrl = config.token ? `/token:${config.token}${baseUrl}` : baseUrl;
          const url = window.location.origin + finalUrl;
          copyToClipboard(url);
          btn.classList.add('copy-flash');
          setTimeout(() => btn.classList.remove('copy-flash'), 700);
        };
      });
      document.addEventListener('click', (event) => {
        if (!event.target.closest('.convert-anchor')) convertPopover.classList.add('hidden');
      });
      window.addEventListener('resize', () => {
        if (!convertPopover.classList.contains('hidden')) positionConvertPopover(convertToggle.closest('.convert-anchor'), convertPopover);
      });
    }

    document.getElementById('auth-btn').onclick = async () => {
      const res = await fetch(`/api/v1/share/${config.slug}/auth`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('auth-pass').value })
      });
      const data = await res.json();
      if (data.ok) location.reload();
      else document.getElementById('auth-err').innerText = data.error || 'Invalid password';
    };

    let matches = []; let curMatchIdx = -1;
    let searchTimeout;
    document.getElementById('search-input').oninput = (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const q = e.target.value.trim();
        if (!q || q.length < 2) {
          renderContent();
          matches = []; curMatchIdx = -1; updateSearchUI(); return;
        }
        renderContent(q);
        matches = Array.from(document.querySelectorAll('.match'));
        curMatchIdx = matches.length ? 0 : -1;
        updateSearchUI(); if (curMatchIdx !== -1) scrollIntoView();
      }, 300); // 300ms 防抖
    };

    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_) {}
        document.body.removeChild(ta);
        return Promise.resolve();
      }
    }

    function updateSearchUI() {
      document.getElementById('search-index').innerText = matches.length ? `${curMatchIdx + 1}/${matches.length}` : '0/0';
      document.getElementById('nav-up').disabled = document.getElementById('nav-down').disabled = matches.length === 0;
    }
    function scrollIntoView() {
      matches.forEach(m => m.classList.remove('current'));
      const target = matches[curMatchIdx];
      if (!target) return;
      target.classList.add('current');
      if (_viewer.scrollHeight > _viewer.clientHeight + 4) {
        const vr = _viewer.getBoundingClientRect();
        const tr = target.getBoundingClientRect();
        _viewer.scrollTop = Math.max(0, _viewer.scrollTop + tr.top - vr.top - vr.height / 3);
      } else {
        target.scrollIntoView({ block: 'center' });
      }
    }
    document.getElementById('nav-down').onclick = () => { if (matches.length) { curMatchIdx = (curMatchIdx + 1) % matches.length; updateSearchUI(); scrollIntoView(); } };
    document.getElementById('nav-up').onclick = () => { if (matches.length) { curMatchIdx = (curMatchIdx - 1 + matches.length) % matches.length; updateSearchUI(); scrollIntoView(); } };

    const _viewer = document.querySelector('.viewer');
    function scrollToTop() {
      if (_viewer && _viewer.scrollTop > 0) _viewer.scrollTo({ top: 0, behavior: 'smooth' });
      else window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    document.getElementById('btn-scroll-top').onclick = scrollToTop;
  </script>
</body>
</html>
